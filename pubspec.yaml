name: kwrmyanmar
description: Offline Korean worker rights and personal-context AI for Myanmar speakers.
publish_to: none
version: 0.2.1+3
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.7.0
  path_provider: ^2.1.5
  file_picker: ^13.1.0
  pdfrx: ^2.6.5
  google_mlkit_text_recognition: ^0.15.0
  url_launcher: ^6.3.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  licenses:
    - assets/fonts/OFL.txt
  assets:
    - assets/cards.json
    - assets/sources.json
    - assets/sources/
  fonts:
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar.ttf
