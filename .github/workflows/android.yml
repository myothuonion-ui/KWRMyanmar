name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KWR_SIGNING_STORE_PASSWORD: ${{ secrets.KWR_SIGNING_STORE_PASSWORD }}
      KWR_SIGNING_KEY_ALIAS: ${{ secrets.KWR_SIGNING_KEY_ALIAS }}
      KWR_SIGNING_KEY_PASSWORD: ${{ secrets.KWR_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            pubspec.yaml
            scripts/prepare_android.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Create Android host
        run: |
          flutter create --platforms=android --org=com.myothuonion --project-name=kwrmyanmar --no-pub /tmp/kwr_host
          cp -R /tmp/kwr_host/android .
          python3 scripts/prepare_android.py
      - name: Offline source cache
        uses: actions/cache@v4
        with:
          path: |
            assets/sources
            assets/fonts/NotoSansMyanmar.ttf
          key: kwr-offline-${{ hashFiles('assets/source_manifest.json') }}
      - name: Prepare complete offline sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python3 scripts/build_sources.py --restore-pinned-release
          python3 scripts/enrich_handbook.py --check
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          dart format lib test integration_test
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          flutter test
      - name: Restore explicit upgrade signing key
        if: ${{ !contains(github.event.head_commit.message, '[bootstrap]') }}
        env:
          KWR_SIGNING_KEYSTORE_B64: ${{ secrets.KWR_SIGNING_KEYSTORE_B64 }}
        run: python3 scripts/configure_signing.py
      - name: Build APK
        run: flutter build apk --release
      - name: Package
        run: |
          mkdir -p dist
          KWR_VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-release.apk "dist/KWRMyanmar-v${KWR_VERSION}.apk"
          cd dist
          sha256sum "KWRMyanmar-v${KWR_VERSION}.apk" > SHA256SUMS.txt
      - name: Verify upgrade signature before publishing
        if: ${{ !contains(github.event.head_commit.message, '[bootstrap]') }}
        run: python3 scripts/verify_signing.py
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native integration and release smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            python3 scripts/prepare_integration.py
            flutter build apk --release --target=integration_test/app_test.dart
            python3 scripts/run_native_test.py
            python3 scripts/smoke_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KWRMyanmar-Android
          path: |
            dist/
            pubspec.lock
            build/app/reports/androidTests/
          retention-days: 30
      - name: Publish preview download
        if: ${{ !contains(github.event.head_commit.message, '[bootstrap]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=v$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "KWR Myanmar $VERSION Preview" --prerelease --notes-file docs/RELEASE.md
          fi
          gh release upload "$VERSION" dist/*.apk dist/SHA256SUMS.txt --clobber
