name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            pubspec.yaml
            scripts/prepare_android.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Create Android host
        run: |
          flutter create --platforms=android --org=com.myothuonion --project-name=kwrmyanmar --no-pub /tmp/kwr_host
          cp -R /tmp/kwr_host/android .
          python3 scripts/prepare_android.py
      - name: Keep preview signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kwr-preview-signing-v1
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/KWRMyanmar-v0.1.0.apk
          cd dist
          sha256sum KWRMyanmar-v0.1.0.apk > SHA256SUMS.txt
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native integration and release smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            python3 scripts/prepare_integration.py
            flutter build apk --release --target=integration_test/app_test.dart
            python3 scripts/run_native_test.py
            python3 scripts/smoke_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KWRMyanmar-Android
          path: |
            dist/
            pubspec.lock
            build/app/reports/androidTests/
          retention-days: 30
      - name: Publish preview download
        if: ${{ !contains(github.event.head_commit.message, '[bootstrap]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=v0.1.0
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title 'KWR Myanmar 0.1.0 Preview' --prerelease --notes-file docs/RELEASE.md
          fi
          gh release upload "$VERSION" dist/*.apk dist/SHA256SUMS.txt --clobber
